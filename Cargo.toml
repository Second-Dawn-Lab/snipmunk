# Snipmunk is its own Cargo workspace. The shared crates come from the sibling dawn-core repository
# (see src-tauri/Cargo.toml); clone it next to this folder: ../dawn-core
[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

# Optimize dependencies even in dev builds: image decoding and scaling are far too slow unoptimized.
# Our own crate stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 3
# No debug information for dependencies (nobody steps into them): the biggest crates need far less memory to compile.
debug = false

# The Windows API bindings are huge and hold no hot code: optimizing them only costs compiler memory and time. At opt-level 3
# rustc needed several GB for them and crashed (0xc0000409) when the system was short of memory.
[profile.dev.package.windows]
opt-level = 0
[profile.dev.package.windows-sys]
opt-level = 0
[profile.dev.package.windows-core]
opt-level = 0

# The dawn-core image crate stays fast in dev builds too (screen capture and scaling).
[profile.dev.package.dawn-capture]
opt-level = 3

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
