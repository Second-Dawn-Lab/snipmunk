[package]
name = "snipmunk"
description = "Snipmunk: a screenshot clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "snipmunk_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# A second launch focuses the running window instead of starting another tray icon.
tauri-plugin-single-instance = "2"
# Update checks against the latest GitHub release, and the restart after installing one.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Pixel loops that are optimized in development builds too.
snipmunk-pixels = { path = "../crates/pixels" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dawn-core = { path = "../../dawn-core/crates/dawn-core" }
# Used from Phase 3 (capture hotkey, screenshots). Linked now so the workspace layout is final.
dawn-hotkeys = { path = "../../dawn-core/crates/dawn-hotkeys" }
dawn-capture = { path = "../../dawn-core/crates/dawn-capture" }

# Saves captures as PNG (and their thumbnails) and puts the latest one on the clipboard. The other formats are only
# read, for images dropped into the capture list.
gif = "0.14"
color_quant = "1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }

# Phase 6: drag captures out into other apps (native drag), the ZIP export (stored, no compression: PNGs are compressed
# already) and the folder / file pickers (see below).
drag = "2"
zip = { version = "2", default-features = false }
# The file and folder pickers (the same plugin Owl-L uses); only its Rust side is used.
tauri-plugin-dialog = "2"
# Joins the segments of a recording without re-encoding (reads and writes MP4 boxes; MIT, brings byteorder, bytes, num-rational).
mp4 = "0.14"

[dev-dependencies]
tempfile = "3"

# Turns off WebView2's built-in browser shortcuts (F5 reloads, Ctrl+P prints, F12, ...) in Snipmunk's windows.
# The same versions Tauri itself uses, so nothing new is compiled.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# The collections of the Windows share sheet (the version the windows crate uses).
windows-collections = "0.2"
# Screen recording: Windows.Graphics.Capture and the Media Foundation H.264 encoder (MIT; brings parking_lot, rayon, thiserror).
windows-capture = "2"

# Snap Layouts for the custom title bar (see src/titlebar.rs): window hit testing needs Win32.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  # The built-in text recognition (Windows.Media.Ocr), see src/ocr.rs.
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  # Clipboard with several formats, the Windows share sheet.
  "ApplicationModel_DataTransfer",
  "Storage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_Media_Audio",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Performance",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # The scrolling screenshot: UI Automation scroll patterns, drawing a window into a bitmap, DPI of a monitor.
  "Win32_UI_Accessibility",
  # The display name of a Microsoft Store (MSIX) app: the AppUserModelId of a process.
  "Win32_Storage_Packaging_Appx",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_System_LibraryLoader",
]
